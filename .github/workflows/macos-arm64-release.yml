name: macOS Apple Silicon release

on:
  push:
    tags:
      - "v1.8-macos"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Apple Silicon DMG
    runs-on: macos-15
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7.0.1

      - name: Set up ARM64 Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Verify the runner and Python are Apple Silicon
        run: |
          test "$(uname -m)" = "arm64"
          python3 -c 'import platform; assert platform.machine() == "arm64", platform.machine()'

      - name: Build the app and DMG
        shell: bash
        run: |
          set -euo pipefail
          if ! ./packaging/macos/build.sh 2>&1 | tee build-macos.log; then
            {
              echo "### Apple Silicon build failure"
              echo '```text'
              tail -n 120 build-macos.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify the DMG
        run: hdiutil verify dist/macos/Crit-Launcher-Installer.dmg

      - name: Attach the DMG and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="dist/macos/Crit-Launcher-Installer.dmg"
          title="Crit Launcher 1.8 for macOS (Apple Silicon)"
          notes="Crit Launcher 1.8 Apple Silicon build. The DMG is ad-hoc signed, not Developer ID signed or notarized; macOS may require approval on first launch."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --draft=false
          else
            gh release create "$tag" "$asset" --title "$title" --notes "$notes"
          fi
