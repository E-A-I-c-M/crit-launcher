name: macOS Apple Silicon release

on:
  push:
    branches:
      - "arena/cef7e8f3-crit-launcher"
    tags:
      - "v1.8-macos"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Apple Silicon DMG
    runs-on: macos-15
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7.0.1

      - name: Set up ARM64 Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Verify the runner and Python are Apple Silicon
        run: |
          test "$(uname -m)" = "arm64"
          python3 -c 'import platform; assert platform.machine() == "arm64", platform.machine()'

      - name: Build the app and DMG
        shell: bash
        run: |
          set -euo pipefail
          if ! ./packaging/macos/build.sh 2>&1 | tee build-macos.log; then
            {
              echo "### Apple Silicon build failure"
              echo '```text'
              tail -n 120 build-macos.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run regression tests
        run: build/macos/venv/bin/python -m unittest discover -s tests

      - name: Smoke-test HTTPS in the packaged app
        env:
          CRIT_LAUNCHER_DATA: ${{ runner.temp }}/crit-launcher-tls-smoke
        run: |
          app="dist/macos/Crit Launcher.app/Contents/MacOS/Crit Launcher"
          if ! "$app" --check-https; then
            {
              echo "### Packaged HTTPS smoke-test failure"
              echo '```text'
              if [ -f "$CRIT_LAUNCHER_DATA/launcher.log" ]; then
                tail -n 160 "$CRIT_LAUNCHER_DATA/launcher.log"
              else
                echo "No launcher.log was created in $CRIT_LAUNCHER_DATA"
                ls -la "$CRIT_LAUNCHER_DATA" || true
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$CRIT_LAUNCHER_DATA/launcher.log" || true
            exit 1
          fi

      - name: Verify the app entitlements and DMG
        run: |
          test -f "dist/macos/Crit Launcher.app/Contents/Resources/entitlements.plist"
          plutil -lint "dist/macos/Crit Launcher.app/Contents/Resources/entitlements.plist"
          hdiutil verify dist/macos/Crit-Launcher-Installer.dmg

      - name: Upload the Apple Silicon DMG build artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: Crit-Launcher-Installer-apple-silicon-${{ github.sha }}
          path: dist/macos/Crit-Launcher-Installer.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Replace the published v1.8 Apple Silicon installer
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="dist/macos/Crit-Launcher-Installer.dmg"
          title="Crit Launcher 1.8 for macOS (Apple Silicon)"
          notes="Crit Launcher 1.8 Apple Silicon build, rebuilt from ${GITHUB_SHA} with Ely.by Horizon skin support. The DMG is ad-hoc signed, not Developer ID signed or notarized; macOS may require approval on first launch."
          gh release upload v1.8-macos "$asset" --clobber
          gh release edit v1.8-macos --title "$title" --notes "$notes" --draft=false

      - name: Attach the DMG and publish the release
        if: github.ref == 'refs/tags/v1.8-macos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="dist/macos/Crit-Launcher-Installer.dmg"
          title="Crit Launcher 1.8 for macOS (Apple Silicon)"
          notes="Crit Launcher 1.8 Apple Silicon build. The DMG is ad-hoc signed, not Developer ID signed or notarized; macOS may require approval on first launch."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --draft=false
          else
            gh release create "$tag" "$asset" --title "$title" --notes "$notes"
          fi
